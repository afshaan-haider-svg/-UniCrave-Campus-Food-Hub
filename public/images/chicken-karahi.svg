<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-chicken-karahi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="100%" stop-color="#040B15" />
    </linearGradient>
    <radialGradient id="glow-chicken-karahi" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg-chicken-karahi)" />
  <circle cx="200" cy="115" r="90" fill="url(#glow-chicken-karahi)" />
  <!-- Plate Base -->
  <circle cx="200" cy="118" r="66" fill="#132742" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
  <circle cx="200" cy="118" r="54" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  <!-- Visual Icon/Graphic -->
  <text x="200" y="130" font-size="52" text-anchor="middle" dominant-baseline="middle">🥘</text>
  <!-- Category Ribbon -->
  <rect x="20" y="18" width="95" height="24" rx="6" fill="rgba(20, 184, 166, 0.15)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1" />
  <text x="67" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#14B8A6" letter-spacing="1" text-anchor="middle">DESI MEALS</text>
  <!-- Title Badge -->
  <rect x="20" y="206" width="360" height="36" rx="8" fill="rgba(7, 19, 36, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <text x="200" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Student Mini Karahi</text>
</svg>